server {
    listen 80;
    # The container sits behind Compose locally or an AWS load balancer in cloud.
    # TLS and the public domain should terminate at the load balancer (ACM),
    # so this server can remain HTTP and accept the forwarded Host header.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Local Compose routing. For ECS with a public domain, prefer ALB path
        # routing: forward /api/* to the API target group and the default route
        # to this client target group. In that setup, requests to /api/* bypass
        # this location, so no ECS service-name DNS or domain-specific Nginx
        # server_name change is needed.
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
