server:
  port: 8000

spring:
  application:
    name: taskstream
    client_domain: ${CLIENT_DOMAIN}
    server_domain: ${SERVER_DOMAIN}

  datasource:
    # Production must connect to the configured RDS database; no local fallback.
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    platform: postgres
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # The H2 console is for local development and stays disabled in production.
  h2:
    console:
      enabled: false
      path: /h2-console

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SENDER_EMAIL}
    password: ${SENDER_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org:
      flywaydb: INFO

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${AWS_S3_BUCKET:taskstream-resources}

app:
  oauth:
    secure-cookies: true

security:
  jwt:
    # Production startup requires the same stable Base64 key on every API replica.
    secret: ${JWT_SECRET}
