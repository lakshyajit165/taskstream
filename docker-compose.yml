services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskstream_db}
      POSTGRES_USER: ${POSTGRES_USER:-taskstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - taskstream-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ./service/taskstream
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-taskstream_db}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-taskstream}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN:-http://localhost:5173}
      SERVER_DOMAIN: ${SERVER_DOMAIN:-http://localhost:8000}
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      SENDER_EMAIL_PASSWORD: ${SENDER_EMAIL_PASSWORD:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-taskstream-resources}
      JWT_SECRET: ${JWT_SECRET:-}
      OAUTH_SECURE_COOKIES: ${OAUTH_SECURE_COOKIES:-false}
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  taskstream-db-data:
