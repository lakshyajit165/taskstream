name: taskstream-service

on:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - "service/**"
      - ".github/workflows/taskstream-app.yml"
      - ".github/workflows/taskstream-service.yml"
      - ".github/workflows/taskstream-publish.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "client/**"
      - "service/**"
      - ".github/workflows/taskstream-app.yml"
      - ".github/workflows/taskstream-service.yml"
      - ".github/workflows/taskstream-publish.yml"

permissions:
  contents: read

jobs:
  test:
    name: Spring Boot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/taskstream
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: service/taskstream/pom.xml

      - name: Run Spring Boot tests
        run: ./mvnw --batch-mode test
