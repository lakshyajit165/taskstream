server:
  port: 8000

spring:
  application:
    name: taskstream
    client_domain: ${CLIENT_DOMAIN}
    server_domain: ${SERVER_DOMAIN}

  datasource:
    url:  ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskstream_db}
    driver-class-name: org.postgresql.Driver
    platform: postgres
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true # Optional: Good for adding Flyway to an existing DB
    locations: classpath:db/migration # Default location for scripts

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SENDER_EMAIL}
    password: ${SENDER_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org:
      flywaydb: INFO

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${AWS_S3_BUCKET:taskstream-resources}

app:
  oauth:
    secure-cookies: ${OAUTH_SECURE_COOKIES:false}

security:
  jwt:
    # Set JWT_SECRET from a secrets manager in deployed environments.
    secret: ${JWT_SECRET:}
