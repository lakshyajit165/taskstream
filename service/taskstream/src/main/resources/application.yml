server:
  port: 8000

spring:
  application:
    name: taskstream

  datasource:
    url: jdbc:postgresql://localhost:5432/taskstream_db
    driver-class-name: org.postgresql.Driver
    platform: postgres
    username: postgres
    password: postgres123

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true # Optional: Good for adding Flyway to an existing DB
    locations: classpath:db/migration # Default location for scripts

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SENDER_EMAIL}
    password: ${SENDER_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org:
      flywaydb: INFO