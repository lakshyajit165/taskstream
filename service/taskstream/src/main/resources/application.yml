server:
  port: 8000

spring:
  application:
    name: taskstream

  datasource:
    url: jdbc:postgresql://localhost:5432/taskstream_db
    driver-class-name: org.postgresql.Driver
    platform: postgres
    username: postgres
    password: postgres123

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true # Optional: Good for adding Flyway to an existing DB
    locations: classpath:db/migration # Default location for scripts

logging:
  level:
    org:
      flywaydb: INFO