# src/test/resources/application-test.yml

spring:
  # Test-only URLs used to initialize security/OAuth configuration without requiring
  # CLIENT_DOMAIN or SERVER_DOMAIN environment variables or contacting real services.
  application:
    client_domain: http://localhost:5173
    server_domain: http://localhost:8000

  # CRITICAL: Stop Spring's general runner from interfering
  sql:
    init:
      mode: never

  # Flyway owns schema creation in tests. Never let Hibernate drop tables when a
  # test context closes, especially if a test accidentally reaches a local DB.
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # To take up the migration scripts.
  flyway:
    enabled: true

  # Dummy mail credentials used during tests to initialize EmailService
  mail:
    username: test@example.com
    password: test-password
